app:
  title: SnipJet

window:
  widthDp: 480
  heightDp: 360
  alwaysOnTop: false
  # TopEnd | BottomEnd | TopStart | BottomStart | Center
  position: TopEnd
  hideDelayMs: 300

capture:
  command: gnome-screenshot
  timeoutSeconds: 300
  tempPrefix: snipjet-
  pathCandidates:
    - /usr/bin/gnome-screenshot
    - /bin/gnome-screenshot
    - /usr/local/bin/gnome-screenshot

clipboard:
  wlCopyCommand: wl-copy
  wlCopyTypeFlag: --type
  wlCopyMime: image/png
  pathCandidates:
    - /usr/bin/wl-copy
    - /bin/wl-copy
    - /usr/local/bin/wl-copy
